name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # 每周一 06:00 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      # pin: actions/checkout@v7
      - uses: actions/checkout@v7
      # pin: github/codeql-action/init@v3.28.0
      - uses: github/codeql-action/init@v3.28.0
        with:
          languages: ${{ matrix.language }}
          #  queries: security-extended,security-and-quality
      # pin: github/codeql-action/autobuild@v3.28.0
      - uses: github/codeql-action/autobuild@v3.28.0
      # pin: github/codeql-action/analyze@v3.28.0
      - uses: github/codeql-action/analyze@v3.28.0
        with:
          category: "/language:${{matrix.language}}"
